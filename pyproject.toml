[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max-audio-editor"
version = "0.1.0"
description = "MaxAudioEditor — Fully Local, GPU-Accelerated, AI-Native Audio Editor & DAW"
readme = "README_PLANNING.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
ai = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "demucs>=4.0.0",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
